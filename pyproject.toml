[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vulnbench-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "claude-agent-sdk==0.2.182"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
include = ["vulnbench*"]
[tool.setuptools.package-data]
"vulnbench.parsers" = ["*.json"]
[tool.pytest.ini_options]
pythonpath = ["."]

markers = ["sdk_integration: offline real Claude CLI initialization (no model prompt)", "containment_integration: OS sandbox enforcement; needs working sandbox runtime"]
